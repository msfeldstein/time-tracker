# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
# Identifiers and signing live in Config/Base.xcconfig (override in Config/Local.xcconfig).
name: TimeTracker

options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES

packages:
  TimeTrackerCore:
    path: Packages/TimeTrackerCore

targets:
  TimeTracker:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: TimeTrackerWidgets
      - package: TimeTrackerCore
    settings:
      base:
        PRODUCT_NAME: TimeTracker
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Config/TimeTracker-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TimeTracker.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  TimeTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: TimeTrackerCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: TimeTrackerWidgets
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).widgets
        INFOPLIST_FILE: Config/TimeTrackerWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TimeTrackerWidgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  TimeTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/TimeTrackerCore/Tests/TimeTrackerCoreTests
        group: TimeTrackerTests
    dependencies:
      - package: TimeTrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TimeTracker:
    build:
      targets:
        TimeTracker: all
        TimeTrackerWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TimeTrackerTests
    archive:
      config: Release
