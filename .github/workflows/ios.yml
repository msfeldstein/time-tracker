name: iOS build and tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Parser tests (Swift package)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run TimeTrackerCore tests
        working-directory: Packages/TimeTrackerCore
        run: swift test

  build:
    name: Build app + widget (iOS Simulator) and run unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TimeTracker.xcodeproj \
            -scheme TimeTracker \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in data[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "Using simulator $UDID for tests"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # Screenshots on Alexa's device size when the runner has that device type.
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          print(sorted(rs, key=lambda r: r["version"])[-1]["identifier"] if rs else "")
          ')
          MINI=$(xcrun simctl create "iPhone 13 mini" com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini "$RUNTIME" 2>/dev/null || echo "$UDID")
          echo "Using simulator $MINI for screenshots"
          echo "SHOT_UDID=$MINI" >> "$GITHUB_ENV"
      - name: Launch the app and take screenshots
        run: |
          mkdir -p screenshots
          xcrun simctl boot "$SHOT_UDID" || true
          xcrun simctl bootstatus "$SHOT_UDID" -b
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/TimeTracker.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl install "$SHOT_UDID" "$APP"
          shot() { sleep "$2"; xcrun simctl io "$SHOT_UDID" screenshot "screenshots/$1.png"; }
          xcrun simctl launch "$SHOT_UDID" "$BUNDLE_ID" -TTDemoData
          shot 1-home 12
          xcrun simctl terminate "$SHOT_UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$SHOT_UDID" "$BUNDLE_ID" -TTOpenToday
          shot 2-today 12
          xcrun simctl terminate "$SHOT_UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$SHOT_UDID" "$BUNDLE_ID" -TTOpenSettings
          shot 3-settings 10
          xcrun simctl terminate "$SHOT_UDID" "$BUNDLE_ID" || true
          xcrun simctl openurl "$SHOT_UDID" timetracker://listen
          shot 4-listen-url 12
          xcrun simctl spawn "$SHOT_UDID" log show --last 10m --predicate 'process == "TimeTracker"' --style compact > screenshots/app-log.txt || true
          cp ~/Library/Logs/DiagnosticReports/TimeTracker* screenshots/ 2>/dev/null || true
          xcrun simctl shutdown "$SHOT_UDID" || true
      - name: Run unit tests on a simulator
        run: |
          set -o pipefail
          UDID="$SIM_UDID"
          xcodebuild test \
            -project TimeTracker.xcodeproj \
            -scheme TimeTracker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Suite|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Check the committed project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- TimeTracker.xcodeproj || {
            echo "::warning::TimeTracker.xcodeproj differs from 'xcodegen generate' output; regenerate and commit."
          }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            test.log
            screenshots/
          if-no-files-found: ignore
